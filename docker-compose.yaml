services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: rs_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./rs-app-be
    restart: always
    ports:
      - "5000:5000"
    environment:
      PGHOST: db
      PGUSER: admin
      PGPASSWORD: password123
      PGDATABASE: rs_db
      PGPORT: 5432
    depends_on:
      - db

  frontend:
    build: ./rs-app-fe
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data:
